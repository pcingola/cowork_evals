[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cowork-evals"
version = "0.3.0"
description = "Run evals for Claude CoWork skills and plugins"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Cingolani" }]
keywords = ["claude", "cowork", "evals", "plugins", "skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "packaging>=24", "python-frontmatter>=1.1"]

[project.urls]
Homepage = "https://github.com/pcingola/cowork_evals"
Repository = "https://github.com/pcingola/cowork_evals"
Documentation = "https://github.com/pcingola/cowork_evals/blob/main/docs/README.md"
Issues = "https://github.com/pcingola/cowork_evals/issues"

[project.scripts]
cowork_evals = "cowork_evals.cli:console_main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Unit tests are the default selection. Integration tests need a real CoWork profile or a
# real CoWork run, so they are deselected. Run them with: scripts/test.sh -m integration
# tests/unit and tests/integration both hold a test_cowork.py. importlib import mode
# keeps the two basenames distinct without an __init__.py in either directory.
addopts = "-q --strict-markers --import-mode=importlib -m 'not integration'"
markers = [
  "integration: needs a real CoWork profile or a real CoWork run",
  "live: submits a real run. A CoWork run costs a VM boot and leaves a session, and an eval run costs the model calls its case makes",
]
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py310"
# `test_needs_311.py` is a fixture whose point is that it does not parse on 3.10. Every
# other file here parses on the target, so ruff reads them all. See plugins/README.md.
extend-exclude = ["plugins/smoke/tests/test_needs_311.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# `docs/` sits at the repository root and is placed beside the modules in the wheel, so the
# checkout keeps one documentation tree and the install carries the same one. Nothing under
# `src/` links into it: a link would name a different path on each side. That is rule R1 in
# docs/library.md.
[tool.hatch.build.targets.wheel]
packages = ["src/cowork_evals"]
force-include = { "docs" = "cowork_evals/docs" }

# The sdist holds the package, the documentation, and the two files the wheel metadata names.
# No development directory ships: not `scripts/`, `tests/`, `plugins/` or `plans/`. That is
# the same rule as the "What ships" table in docs/library.md. A pattern is anchored, because
# an unanchored one matches at every depth and would pull in each directory's own README.md.
# Hatchling adds `pyproject.toml`, `PKG-INFO` and `.gitignore` itself.
[tool.hatch.build.targets.sdist]
include = ["/src/cowork_evals", "/docs", "/README.md", "/LICENSE"]
