# `cowork_evals init` writes this file to cowork_evals.yaml in the working directory. Set
# cowork.profile there. Every other commented line is the built-in default, except
# docker.extra_ca_file, which has no default and shows the shape of a value. A copy with the
# rest commented out behaves as no file at all.
#
# The four sections, the ladder over them and the rules the loader applies are in
# docs/library.md. Each section links to the file that owns its keys.
#
# cowork_evals.yaml is git-ignored. It names a profile, which is an identifier, and the
# public repository rule in README.md applies to every value in it. This example file is
# committed and carries no value that identifies a machine, an account or a network.

# The CoWork driver. docs/cowork_driver.md.
cowork:
  # Required by the CoWork backend, and the one key with no default. A bare name resolves
  # under ~/Library/Application Support. An absolute path is taken as it stands.
  profile: <the Application Support profile directory name>
  # surface: cowork
  # settle_seconds: 3.0
  # session_timeout: 120.0
  # idle_seconds: 20.0
  # run_timeout: 1800.0
  # max_runs: 50
  # Ask once per process for the keyboard, in a modal that forces itself in front of
  # whatever you are working in. `none` fires without asking, which is the route for an
  # unattended run.
  # consent: dialog
  # consent_timeout: 10.0
  # run_log: ~/.cowork-runs.jsonl
  # log_dir: logs

# The claude plugin eval argument list, and the CoWork backend's judge model.
# docs/running_evals.md.
eval:
  # model: sonnet
  # judge_model: haiku
  # allow_tools: [Bash, Read, Glob, Grep, Write, Edit, WebFetch, Skill]
  # `with-without` runs every case a second time with no plugin loaded, and the verdict
  # then decides on each case's delta rather than on its score. It costs twice as much
  # and it stops scoring a tool_used: Skill grader. Both are --docker only.
  # ablation: none
  # delta_threshold: 0
  # max_cost_usd: 5
  # max_cost_total_usd: 25
  # keep_traces: true

# The container backend. docs/docker.md.
docker:
  # platform: linux/arm64
  # claude_code_version: 2.1.265
  # How Claude Code authenticates inside the run container. `login` is the claude.ai login
  # this package makes with `setup --docker`. `bedrock` forwards the four Bedrock variables
  # from the host and makes no login. docs/docker.md.
  # credential: login
  # Where the `login` route keeps that login. Read under `login` and under nothing else.
  # login_dir: ~/.cache/cowork_evals/claude
  # An extra root CA, for a host whose network inspects TLS. Unset, or naming a file that
  # is not there, passes nothing. The certificate never enters this repository.
  # extra_ca_file: ~/extra_root_ca.pem
  # Host variable names forwarded into the run container, for a skill that reads a
  # credential from the environment. [ACME_API_KEY] forwards that one name. The names
  # alone, never a value. What a name holds stays on the host and in the container, and
  # reaches no log and no result. A name that is unset or empty on the host fails the
  # preflight, and a name that would carry Claude's own credential is refused.
  # docs/docker.md.
  # env_passthrough: []

# The eval panel. docs/panel.md.
panel:
  # Where a record of what each case did outlives the run directory it was produced in.
  # `--out` does not move it: that option relocates what one invocation produced, and a
  # record is read after that invocation's directory has been pruned.
  # root: logs/evals/history
